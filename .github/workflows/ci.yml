name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HeartbeatDesktop.sln

      - name: Build
        run: dotnet build HeartbeatDesktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HeartbeatDesktop.sln --configuration Release --no-build --verbosity normal
